name: deploy-manifests

on:
  push:
    branches:
      - master
    paths:
      - 'infra/**'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
  
      - uses: actions/checkout@v2

      
      - name: Install OCI CLI
        run: pip install --upgrade oci-cli

     
      - name: Configure OCI CLI
        env:
          OCI_TENANCY_OCID: ${{ secrets.OCI_TENANCY_OCID }}
          OCI_USER_OCID: ${{ secrets.OCI_USER_OCID }}
          OCI_FINGERPRINT: ${{ secrets.OCI_FINGERPRINT }}
          OCI_PRIVATE_KEY: ${{ secrets.OCI_PRIVATE_KEY }}
          OCI_REGION: ${{ secrets.OCI_REGION }}
        run: |
          mkdir -p ~/.oci
          echo "${OCI_PRIVATE_KEY}" > ~/.oci/oci_api_key.pem
          chmod 600 ~/.oci/oci_api_key.pem

          echo "[DEFAULT]" > ~/.oci/config
          echo "user=${OCI_USER_OCID}" >> ~/.oci/config
          echo "fingerprint=${OCI_FINGERPRINT}" >> ~/.oci/config
          echo "key_file=$HOME/.oci/oci_api_key.pem" >> ~/.oci/config
          echo "tenancy=${OCI_TENANCY_OCID}" >> ~/.oci/config
          echo "region=${OCI_REGION}" >> ~/.oci/config
          chmod 600 ~/.oci/config

      
      - name: Set up kubeconfig for Oracle cluster
        env:
          OCI_CLUSTER_ID: ${{ secrets.OCI_CLUSTER_ID }}
          OCI_REGION: ${{ secrets.OCI_REGION }}
        run: |
          mkdir -p $HOME/.kube
          oci ce cluster create-kubeconfig \
            --cluster-id ${OCI_CLUSTER_ID} \
            --file $HOME/.kube/config \
            --region ${OCI_REGION} \
            --token-version 2.0.0 \
            --kube-endpoint PUBLIC

     
      - name: Deploy manifests to cluster
        run: |
          kubectl apply -f infra/k8s
          kubectl apply -f infra/k8s-prod

